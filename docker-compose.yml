version: '3.8'

services:
  # 1. MySQL Database Container
  mysql:
    image: mysql:8.0
    container_name: aiagent_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ai_agent
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. AI Agent Application Container
  app:
    image: anhzxje/ai_agent:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiagent_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_agent?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-YOUR_GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      AGENT_ALLOWED_PATH: /workspace
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Mount thư mục local vào container để AI Agent đọc mã nguồn (Tùy chỉnh theo máy bạn bè)
      - ./:/workspace

volumes:
  mysql_data:
