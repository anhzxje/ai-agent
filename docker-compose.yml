version: '3.8'

services:
  # 1. MySQL Database Container
  mysql:
    image: mysql:8.0
    container_name: aiagent_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_agent
      MYSQL_USER: ${DB_USERNAME:-ai_agent}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. AI Agent Application Container
  app:
    image: anhzxje/ai_agent:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiagent_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_agent?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-ai_agent}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set a random Base64 JWT_SECRET before starting}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      AGENT_ALLOWED_PATH: /workspace
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Mount thư mục local vào container để AI Agent đọc mã nguồn (Tùy chỉnh theo máy bạn bè)
      - ./:/workspace:ro

volumes:
  mysql_data:
