name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: aiagent-ci-${{ github.run_id }}
  DB_ROOT_PASSWORD: ci-root-password
  DB_USERNAME: ci_user
  DB_PASSWORD: ci-app-password
  GOOGLE_API_KEY: ci-placeholder-key
  JWT_SECRET: Y2ktdGVzdC1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcy1sb25nIQ==
  ADMIN_INITIAL_PASSWORD: ci-admin-password

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests and package application
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Check feature boundaries and compiled dependencies
        run: |
          python3 -m unittest discover -s src/test/python -p 'test_*.py'
          python3 scripts/check-architecture.py --bytecode target/classes

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run all frontend tests
        run: node --test

      - name: Run offline browser regression
        env:
          UI_SCREENSHOTS: ${{ runner.temp }}/aiagent-browser
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROMIUM_PATH" || { echo 'Chromium browser is required' >&2; exit 1; }
          node src/test/js/workspace.browser.cjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-screenshots
          path: ${{ runner.temp }}/aiagent-browser/
          if-no-files-found: warn
          retention-days: 7

  configuration-validation:
    name: Configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag aiagent:ci .

  compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: configuration-validation

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start stack and wait for healthy services
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Verify application health
        run: curl --fail --show-error --silent http://localhost:8080/actuator/health

      - name: Show container logs after failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
