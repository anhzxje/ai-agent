name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Java tests and package application
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Run frontend tests
        run: node --test src/test/js/frontend.test.cjs

      - name: Verify Docker image builds
        run: docker build --tag aiagent:ci .

      - name: Smoke test Docker Compose stack
        env:
          DB_ROOT_PASSWORD: ci-root-password
          DB_USERNAME: ci_user
          DB_PASSWORD: ci-app-password
          GOOGLE_API_KEY: ci-placeholder-key
          JWT_SECRET: Y2ktdGVzdC1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcy1sb25nIQ==
          ADMIN_INITIAL_PASSWORD: ci-admin-password
        run: |
          docker compose up --detach --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Compose app is responding."
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
